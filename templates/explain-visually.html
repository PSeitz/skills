<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      background: light-dark(#ffffff, #111827);
      color: light-dark(#1f2937, #e5e7eb);
    }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin-top: 0; }
    a { color: light-dark(#2563eb, #93c5fd); }
    pre, code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 0.5rem;
      background: light-dark(#f3f4f6, #1f2937);
    }
    :not(pre) > code {
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      background: light-dark(#f3f4f6, #1f2937);
    }
    .diagram {
      margin: 2rem 0;
      padding: 1rem;
      overflow-x: auto;
      border: 1px solid light-dark(#e5e7eb, #374151);
      border-radius: 0.75rem;
      background: #ffffff;
      text-align: center;
    }
    .diagram svg { max-width: 100%; height: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 0.5rem 0.75rem; border: 1px solid light-dark(#d1d5db, #4b5563); }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid #9ca3af; }
  </style>
</head>
<body>
  <main>{{CONTENT}}</main>
</body>
</html>
